<div
  class="dark from-dark-950 to-dark-900 flex min-h-screen flex-col items-center bg-gradient-to-br p-4 text-gray-100">
  <div class="w-full max-w-7xl">
    <!-- Formulario de búsqueda -->
    <div class="relative mb-10 overflow-hidden">
      <app-search-form (search)="onSearch($event)"></app-search-form>
    </div>

    <!-- Sección de destinos populares -->
    <div class="w-full">
      <h2 class="mb-4 text-xl font-bold">Popular Destinations</h2>
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4">
        @for (destination of $destinations(); track destination) {
          <app-destination-card [destination]="destination" />
        }
      </div>

      <!-- Sección de ofertas especiales -->
      <div class="mt-10">
        <h2 class="mb-4 text-xl font-bold">Special Offers</h2>
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
          @for (offer of $specialOffers(); track offer) {
            <app-special-offer-card [offer]="offer"> </app-special-offer-card>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="border-dark-700/30 mt-10 w-full max-w-7xl border-t pt-6">
    <div class="text-center text-xs text-gray-500">
      <p>© 2025 Travel Planner. All images from Unsplash.</p>
    </div>
  </div>
</div>
